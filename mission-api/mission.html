<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 데이터 비서 · 1차 미션</title>
<style>
:root{--ink:#17213d;--muted:#64708a;--line:#dce2ee;--accent:#2355c6;--soft:#f5f7fb;--ok:#19754b}
*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font-family:Arial,"Noto Sans KR",sans-serif}main{max-width:1080px;margin:auto;padding:28px 18px 60px}
.hero,.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 7px 24px #17213d0c}h1{margin:0 0 8px;font-size:30px}h2{margin:0 0 14px;font-size:20px}.sub,.status{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.label{font-size:13px;color:var(--muted)}.value{font-size:23px;font-weight:700;margin-top:6px}
section{margin-top:18px}.row{display:flex;gap:9px;flex-wrap:wrap}.row>*{flex:1}input,textarea{border:1px solid var(--line);border-radius:9px;padding:11px;font:inherit;min-width:130px}button{border:0;border-radius:9px;padding:11px 14px;background:var(--ink);color:#fff;font:inherit;cursor:pointer}button.alt{background:#e9eefb;color:var(--ink)}button.danger{background:#9b2c2c}
table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.two{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.messages{height:230px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}.msg{padding:9px;border-radius:8px;margin:7px 0}.user{background:#e9eefb}.assistant{background:#f0f3f7}.status{min-height:22px;margin-top:10px}.ok{color:var(--ok)}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}table{font-size:14px}}
</style>
</head>
<body><main>
<div class="hero"><h1>AI 데이터 비서</h1><p class="sub">1차 미션 시연 · 데이터 등록·조회·삭제·요약·대화 저장</p>
<div class="row"><button id="seed">100개 샘플 만들기</button><button id="refresh" class="alt">전체 새로고침</button><a href="/docs" target="_blank"><button class="alt">API 문서 보기</button></a></div><div id="status" class="status">서버 연결을 확인하고 있습니다.</div></div>
<div class="grid"><div class="card"><div class="label">기간</div><div id="period" class="value">-</div></div><div class="card"><div class="label">기록 수</div><div id="count" class="value">0</div></div><div class="card"><div class="label">평균</div><div id="average" class="value">-</div></div><div class="card"><div class="label">추세</div><div id="trend" class="value">-</div></div></div>
<section class="card"><h2>수업 기록 등록</h2><div class="row"><input id="date" type="date"><input id="value" type="number" step="0.1" placeholder="점수 또는 값"><input id="memo" placeholder="수업 메모"><button id="add">등록</button></div><div style="overflow:auto"><table><thead><tr><th>날짜</th><th>값</th><th>메모</th><th>관리</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section class="card two"><div><h2>요약 기반 질문</h2><div id="messages" class="messages"></div><div class="row"><input id="question" placeholder="예: 기록의 변화와 다음 목표를 알려줘"><button id="ask">질문하기</button></div></div><div><h2>대화 기록</h2><div id="history">아직 대화가 없습니다.</div></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function call(path,opt={}){const r=await fetch(path,{headers:{"Content-Type":"application/json"},...opt});if(!r.ok)throw new Error(await r.text());return r.json()}
function setStatus(t,ok=false){$("status").textContent=t;$("status").className="status"+(ok?" ok":"")}
async function refresh(){try{const [s,rows,hs]=await Promise.all([call("/api/data/summary"),call("/api/data?limit=1000"),call("/api/conversations")]);$("period").textContent=s.period.start?s.period.start+" ~ "+s.period.end:"-";$("count").textContent=s.count;$("average").textContent=s.count?s.average:"-";$("trend").textContent=({up:"상승",down:"하락",flat:"보합",no_data:"-"})[s.trend]||s.trend;$("rows").innerHTML=rows.slice().reverse().slice(0,30).map(r=>'<tr><td>'+esc(r.date)+'</td><td>'+esc(r.value)+'</td><td>'+esc(r.memo)+'</td><td><button class="danger" onclick="removeRow(\''+r.id+'\')">삭제</button></td></tr>').join("")||'<tr><td colspan="4">등록된 기록이 없습니다.</td></tr>';$("history").innerHTML=hs.slice(0,8).map(h=>"<p><b>"+esc(h.title)+"</b><br><small>"+esc(h.updated_at)+"</small></p>").join("")||"아직 대화가 없습니다.";setStatus("서버 연결 완료",true)}catch(e){setStatus("연결 확인 필요: "+e.message)}}
async function removeRow(id){await call("/api/data/"+id,{method:"DELETE"});refresh()}
$("add").onclick=async()=>{if(!$("date").value||$("value").value===""){setStatus("날짜와 값을 입력해 주세요.");return}await call("/api/data",{method:"POST",body:JSON.stringify({date:$("date").value,value:Number($("value").value),memo:$("memo").value})});$("memo").value="";refresh()};
$("seed").onclick=async()=>{setStatus("샘플 100개를 저장하고 있습니다.");const start=new Date("2026-01-01");for(let i=0;i<100;i++){const d=new Date(start);d.setDate(d.getDate()+i);await call("/api/data",{method:"POST",body:JSON.stringify({date:d.toISOString().slice(0,10),value:Number((50+i*.2+(i%7)*.45).toFixed(2)),memo:"demo record "+(i+1)})})}refresh()};
$("ask").onclick=async()=>{const q=$("question").value.trim();if(!q)return;$("messages").insertAdjacentHTML("beforeend",'<div class="msg user">'+esc(q)+"</div>");$("question").value="";try{const d=await call("/api/chat",{method:"POST",body:JSON.stringify({message:q})});$("messages").insertAdjacentHTML("beforeend",'<div class="msg assistant">'+esc(d.answer)+"</div>");refresh()}catch(e){setStatus("질문 처리 실패: "+e.message)}};
$("refresh").onclick=refresh;$("date").value=new Date().toISOString().slice(0,10);refresh();
</script></body></html>
